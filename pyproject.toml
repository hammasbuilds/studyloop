[project]
name = "studyloop"
version = "0.1.0"
description = "Turn a textbook or web page into a personal tutor: course outline, ask-the-book with verified quotes, quizzes, mastery tracking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "pypdf>=6,<7",
    "book-to-skill",
    "web2md",
]

[tool.uv.sources]
book-to-skill = { path = "../book-to-skill" }
web2md = { path = "../web-to-markdown" }

[project.scripts]
studyloop = "studyloop.launcher:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studyloop"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/studyloop/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: FastAPI parameter defaults are the framework idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
